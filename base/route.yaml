kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: fotoshow
  labels:
    app: fotoshow
    app.kubernetes.io/component: fotoshow
    app.kubernetes.io/instance: fotoshow
    app.kubernetes.io/name: fotoshow
spec:
  to:
    kind: Service
    name: fotoshow
    weight: 100
  port:
    targetPort: 18181-tcp
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
